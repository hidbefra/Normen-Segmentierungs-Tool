[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "normen_segmentierung_tool"
version = "0.1.0"
description = "Normen-PDFs segmentieren, korrigieren und als CSV exportieren"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.111.0",
  "uvicorn>=0.24.0",
  "pymupdf>=1.22.0",
  "pandas>=2.2.0",
  "python-dotenv>=1.0.0",
  "rich>=13.0.0",
  "sqlalchemy>=2.0.0"
]

[project.scripts]
normen-tool-gui = "normen_tool.server_launcher:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.4.0",
  "pytest-cov>=4.2.0",
  "ruff>=0.0.300",
  "mypy>=1.8.0",
  "pre-commit>=3.5.0",
  "types-requests>=0.0.0",
  "httpx2>=0.23.0"
]
